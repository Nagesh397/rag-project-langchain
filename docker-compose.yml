services:
  rag:
    build: .
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
    ports:
      - "7860:7860"
    command: ["python", "gradio_app.py"]
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  qdrant_data:
  ollama_models:

