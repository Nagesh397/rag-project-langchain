services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    networks:
      - hospital-rag

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "7860:7860"
    depends_on:
      - api
    networks:
      - hospital-rag

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - hospital-rag

  ollama:
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - hospital-rag

volumes:
  qdrant_data:
  ollama_models:

networks:
  hospital-rag:
    driver: bridge
